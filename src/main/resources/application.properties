server.port=8080

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/medilink_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Jubaier2@}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL95Dialect
spring.jpa.open-in-view=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Multipart File Upload Limits (Max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Vision Prescription Scanning (Gemini + Groq)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.2-11b-vision-preview}

# =========================================================
# MediLink Market Price / Apify Configuration
# =========================================================
medilink.market.enabled=${MARKET_API_ENABLED:false}
medilink.market.provider=${MARKET_PROVIDER:database}

medilink.market.base-url=${MARKET_API_BASE_URL:https://api.apify.com/v2}
medilink.market.api-key=${MARKET_API_KEY:}
medilink.market.api-key-header=${MARKET_API_KEY_HEADER:Authorization}
medilink.market.api-key-prefix=${MARKET_API_KEY_PREFIX:Bearer}

medilink.market.apify-actor-id=${MEDICINE_APIFY_ACTOR_ID:riad_h~medex-medicine-scraper}

medilink.market.connect-timeout-ms=${MARKET_CONNECT_TIMEOUT_MS:10000}
medilink.market.read-timeout-ms=${MARKET_READ_TIMEOUT_MS:120000}
medilink.market.max-retries=${MARKET_MAX_RETRIES:2}

medilink.market.fallback-enabled=${MARKET_FALLBACK_ENABLED:true}

medilink.market.sync-delay-ms=${MARKET_SYNC_DELAY_MS:300000}
medilink.market.initial-delay-ms=${MARKET_INITIAL_DELAY_MS:15000}

medilink.market.simulation-enabled=${MARKET_SIMULATION_ENABLED:false}
medilink.market.webhook-secret=${MARKET_WEBHOOK_SECRET:}
medilink.market.max-price-change-percent=${MARKET_MAX_PRICE_CHANGE_PERCENT:50.0}
medilink.market.search-depth=${MARKET_SEARCH_DEPTH:1}
medilink.market.max-results=${MARKET_MAX_RESULTS:100}
medilink.market.request-delay-ms=${MARKET_REQUEST_DELAY_MS:200}

